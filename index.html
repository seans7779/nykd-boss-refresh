<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诺亚传说BOSS刷新时间</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="诺亚传说手游BOSS刷新时间管理工具">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BOSS刷新">
    <meta name="msapplication-TileColor" content="#1a1a1a">
    <meta name="msapplication-TileImage" content="./icon-192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0a0a0a;
            min-height: 100vh;
            color: #e0e0e0;
            /* 防止移动端缩放 */
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            /* 优化触摸滚动 */
            -webkit-overflow-scrolling: touch;
            /* 防止选中文本 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 15px;
            background: #1a1a1a;
            min-height: 100vh;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            /* 移动端优化 */
            position: relative;
            overflow-x: hidden;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                padding: 10px;
                border-left: none;
                border-right: none;
            }
            
            .header h1 {
                font-size: 20px !important;
            }
            
            .btn {
                padding: 12px 16px !important;
                font-size: 14px !important;
                min-height: 44px; /* iOS推荐的最小触摸目标 */
            }
            
            .form-group input,
            .form-group select {
                padding: 12px !important;
                font-size: 16px !important; /* 防止iOS缩放 */
                min-height: 44px;
            }
        }

        /* 超小屏幕适配 */
        @media (max-width: 360px) {
            .container {
                padding: 8px;
            }
            
            .header {
                margin-bottom: 20px !important;
                padding: 15px 0 !important;
            }
            
            .header h1 {
                font-size: 18px !important;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            background: #1e1e1e;
            color: #00ff88;
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, #0088ff);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.7;
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: #00ff88;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 16px;
            background: #2a2a2a;
            color: #e0e0e0;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .time-inputs input {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #2a2a2a;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            /* 移动端触摸优化 */
            -webkit-tap-highlight-color: rgba(0, 255, 136, 0.2);
            touch-action: manipulation;
            min-height: 44px;
        }

        .btn:hover {
            background: #00ff88;
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            border-color: #0088ff;
            color: #0088ff;
        }

        .btn-secondary:hover {
            background: #0088ff;
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.3);
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8, #138496);
            color: white;
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #138496, #117a8b);
            transform: translateY(-2px);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 4px;
            border-left: 3px solid #00ff88;
            border: 1px solid #333;
        }

        .result h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .boss-list {
            margin-top: 20px;
        }

        .server-section {
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            background: #1e1e1e;
        }

        .server-header {
            background: #2a2a2a;
            color: #00ff88;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-bottom: 1px solid #333;
        }

        .server-header:hover {
            background: #333;
            box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .server-content {
            display: none;
            padding: 15px;
            background: #1a1a1a;
        }

        .server-content.active {
            display: block;
        }

        .boss-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }

        .boss-item:hover {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .boss-level {
            font-weight: 400;
            color: #0088ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .boss-times {
            font-size: 12px;
            color: #888;
            font-family: 'Consolas', monospace;
        }

        .management-section {
            margin-top: 30px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .management-section h3 {
            color: #0088ff;
            margin-bottom: 15px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-form {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .add-form.active {
            display: block;
        }

        .add-form h4 {
            color: #00ff88;
            margin-bottom: 15px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .boss-time-manager {
            margin-top: 20px;
        }

        .boss-time-manager h3 {
            color: #0088ff;
            margin-bottom: 15px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .manager-form {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .current-boss-times {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .current-boss-times h4 {
            color: #00ff88;
            margin-bottom: 15px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .time-item:hover {
            border-color: #00ff88;
        }

        .time-info {
            color: #e0e0e0;
        }

        .time-date {
            color: #0088ff;
            font-size: 12px;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff6666;
        }

        .image-upload-section {
            margin: 15px 0;
        }

        .image-upload-section label {
            display: block;
            margin-bottom: 8px;
            color: #00ff88;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-upload-section input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2a2a2a;
            color: #e0e0e0;
            cursor: pointer;
        }

        .image-upload-section input[type="file"]:hover {
            border-color: #00ff88;
        }

        .image-preview {
            margin-top: 10px;
            position: relative;
            display: inline-block;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 150px;
            display: block;
        }

        .remove-image-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-image-btn:hover {
            background: #ff6666;
        }

        .boss-image {
            max-width: 100px;
            max-height: 80px;
            border-radius: 4px;
            border: 1px solid #333;
            margin-top: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .boss-image:hover {
            border-color: #00ff88;
            transform: scale(1.05);
        }

        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        .image-modal img {
              position: absolute;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              max-width: 90%;
              max-height: 90%;
              border-radius: 4px;
          }

          .boss-image-item {
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 15px;
              margin-bottom: 10px;
              background: #2a2a2a;
              border: 1px solid #333;
              border-radius: 4px;
          }

          .boss-image-info {
              display: flex;
              align-items: center;
              gap: 15px;
          }

          .boss-image-thumbnail {
              width: 60px;
              height: 60px;
              object-fit: cover;
              border-radius: 4px;
              border: 1px solid #333;
              cursor: pointer;
          }

          .boss-image-thumbnail:hover {
              border-color: #00ff88;
          }

          .boss-image-details {
              color: #e0e0e0;
          }

          .boss-image-level {
              font-size: 16px;
              font-weight: bold;
              color: #00ff88;
          }

          .boss-image-actions {
              display: flex;
              gap: 10px;
          }

          .btn-small {
              padding: 8px 12px;
              font-size: 12px;
              min-width: auto;
          }

          .btn-danger {
              background: #ff4444;
              border-color: #ff4444;
          }

          .btn-danger:hover {
              background: #ff6666;
          }

          .no-images-message {
              text-align: center;
              color: #888;
              padding: 20px;
              font-style: italic;
          }

          .toggle-icon {
              transition: transform 0.3s ease;
              color: #888;
          }

          .toggle-icon.rotated {
            transform: rotate(180deg);
        }

        /* BOSS时间线样式 */
        .boss-timeline {
            margin-top: 20px;
        }

        .timeline-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .timeline-controls .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        .reminder-status {
            color: #00ff88;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reminder-status.active {
            color: #ff6666;
        }

        .current-time-indicator {
            position: relative;
            margin-bottom: 20px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            border: 1px solid #333;
            text-align: center;
        }

        .current-time-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff6666, #00ff88);
            animation: pulse 2s infinite;
        }

        .current-time-text {
            color: #00ff88;
            font-weight: bold;
            font-size: 16px;
        }

        .timeline-container {
            background: #1e1e1e;
            border-radius: 4px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .timeline-hour {
            display: flex;
            border-bottom: 1px solid #333;
            min-height: 60px;
            position: relative;
        }

        .timeline-hour:last-child {
            border-bottom: none;
        }

        .timeline-time {
            width: 80px;
            padding: 15px 10px;
            background: #2a2a2a;
            border-right: 1px solid #333;
            text-align: center;
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 14px;
        }

        .timeline-events {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .timeline-event {
            background: #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #00ff88;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .timeline-event:hover {
            background: #444;
            transform: scale(1.02);
        }

        .timeline-event.upcoming {
            border-left-color: #ff6666;
            background: #3a2a2a;
        }

        .timeline-event.past {
            border-left-color: #666;
            background: #2a2a2a;
            opacity: 0.6;
        }

        .timeline-event-server {
            font-weight: bold;
            color: #00ff88;
        }

        .timeline-event-boss {
            color: #0088ff;
        }

        .timeline-event-countdown {
            color: #ff6666;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        .timeline-current-time {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #ff6666;
            z-index: 10;
            box-shadow: 0 0 10px rgba(255, 102, 102, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff88;
        }

        /* 管理界面样式 */
        .management-section-item {
            margin-bottom: 25px;
            padding: 20px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .management-section-item h5 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            min-width: 150px;
        }

        .input-group .btn {
            flex-shrink: 0;
        }

        .items-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2a2a2a;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            transition: all 0.3s ease;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-row:hover {
            background: #333;
        }

        .item-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .item-name {
            color: #e0e0e0;
            font-weight: 500;
        }

        .item-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-status.active {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .item-status.inactive {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            min-height: auto;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc3333);
            border-color: #ff4444;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #ff6666, #ff4444);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .btn-edit {
            background: linear-gradient(135deg, #ffa500, #ff8c00);
            border-color: #ffa500;
        }

        .btn-edit:hover {
            background: linear-gradient(135deg, #ffb733, #ffa500);
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
        }

        .current-image {
            margin-top: 15px;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .current-image h6 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .current-image img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 4px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
                border: none;
            }
            
            .header h1 {
                font-size: 20px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group input,
            .input-group select,
            .input-group .btn {
                width: 100%;
            }

            .item-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .item-actions {
                justify-content: center;
            }
        }
    /* 清除缓存按钮样式 */
.clear-cache-btn {
    margin-top: 8px;
    padding: 8px 12px;
    background: linear-gradient(135deg, #00c853, #00e676);
    color: #0a0a0a;
    border: 1px solid #2e7d32;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
    transition: all 0.2s ease;
}
.clear-cache-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 16px rgba(0, 230, 118, 0.4);
}
.clear-cache-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    filter: grayscale(20%);
}
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>诺亚传说BOSS刷新</h1>
            <p>精准计算BOSS复活时间</p>
            <button id="clearCacheBtn" class="clear-cache-btn" onclick="clearAppCache()">
                🔄 清除缓存
            </button>
        </div>

        <div class="form-group">
            <label for="server">选择服务器：</label>
            <select id="server">
                <option value="">请选择服务器</option>

        <!-- PWA Service Worker Registration -->
        <script>
            // 注册Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then(registration => {
                            console.log('PWA: Service Worker注册成功', registration.scope);
                            
                            // 检查更新
                            registration.addEventListener('updatefound', () => {
                                const newWorker = registration.installing;
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        // 有新版本可用
                                        if (confirm('发现新版本，是否立即更新？')) {
                                            window.location.reload();
                                        }
                                    }
                                });
                            });
                        })
                        .catch(error => {
                            console.log('PWA: Service Worker注册失败', error);
                        });
                });
            }

            // PWA安装提示
            let deferredPrompt;
            const installButton = document.createElement('button');
            installButton.textContent = '安装应用';
            installButton.className = 'btn btn-success';
            installButton.style.display = 'none';
            installButton.style.position = 'fixed';
            installButton.style.bottom = '20px';
            installButton.style.right = '20px';
            installButton.style.zIndex = '1000';
            document.body.appendChild(installButton);

            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('PWA: 可以安装');
                e.preventDefault();
                deferredPrompt = e;
                installButton.style.display = 'block';
            });

            installButton.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('PWA: 用户选择', outcome);
                    deferredPrompt = null;
                    installButton.style.display = 'none';
                }
            });

            // 检测是否已安装
            window.addEventListener('appinstalled', () => {
                console.log('PWA: 应用已安装');
                installButton.style.display = 'none';
            });
        </script>

        <!-- 清除缓存逻辑 -->
        <script>
            async function clearAppCache() {
                const btn = document.getElementById('clearCacheBtn');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '清理中…';
                }
                try {
                    // 注销所有Service Worker
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(regs.map(r => r.unregister()));
                    }
                    // 清理所有Cache Storage
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        await Promise.all(keys.map(k => caches.delete(k)));
                    }
                    // 清理本地存储数据
                    try { localStorage.removeItem('nykd-boss-data'); } catch (e) {}
                    // 强制带缓存破坏参数刷新
                    const url = new URL(window.location.href);
                    url.searchParams.set('_', Date.now().toString());
                    if (btn) btn.textContent = '已清理，正在刷新…';
                    window.location.replace(url.toString());
                } catch (err) {
                    console.error('清除缓存失败:', err);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '🔄 清除缓存';
                    }
                    alert('清除缓存失败，请手动刷新或重启浏览器。');
                }
            }
        </script>
